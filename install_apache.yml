---
- hosts: all
  become: true
  tasks:

  - name: install apache2 package
    ansible.builtin.package:
      name:
        - "{{ apache_package }}"
        - "{{ php_package }}"
      state: latest
      update_cache: yes
    when: ansible_facts['distribution'] == "Debian"


  - name: install httpd package
    ansible.builtin.dnf:
      name:
        - httpd
        - php
      state: latest
      update_cache: yes
    when: ansible_facts['distribution'] == "Fedora"

